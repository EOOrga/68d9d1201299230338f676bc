name: minierbernardmarcel
description: Offline operations management for containers, tasks, revenue, and reservations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - docs/featured.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: docs/icon.png
  adaptive_icon_foreground: docs/icon.png
  adaptive_icon_background: "#1565C0"
  min_sdk_android: 23
  web:
    generate: true
    image_path: docs/icon.png
    background_color: "#F6F8FB"
    theme_color: "#0E52A0"
